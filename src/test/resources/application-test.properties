# Test Configuration
spring.application.name=ridelist-test

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# Disable Flyway for tests (using Hibernate auto-ddl)
spring.flyway.enabled=false

# JWT Configuration
jwt.secret=test-secret-key-for-jwt-tokens-must-be-at-least-32-characters-long
jwt.expiration=3600000
jwt.refresh-expiration=86400000

# AWS S3 Configuration (mock values for testing)
aws.access-key=test-access-key
aws.secret-key=test-secret-key
aws.region=us-east-1
aws.s3.bucket=test-bucket

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Logging
logging.level.root=WARN
logging.level.com.ridelist=DEBUG
logging.level.org.springframework.security=DEBUG

# Application Settings
ridelist.image.min-count=1
ridelist.image.max-count=10
ridelist.image.allowed-types=image/jpeg,image/png,image/webp
ridelist.image.max-size-mb=5

# Disable OpenAPI for tests
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
