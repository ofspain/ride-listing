# Application
spring.application.name=ridelist

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:ridelist}
spring.datasource.username=${DB_USERNAME:ridelist}
spring.datasource.password=${DB_PASSWORD:ofspain86}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# Server
server.port=8090
server.error.include-message=always
server.error.include-binding-errors=always

# code to generate: openssl rand -base64 {lenght} eg openssl rand -base64 128

# JWT Configuration
jwt.secret=${JWT_SECRET:kLpTbDxY+mPEGlAmiQLGAl9OuI5h2VwvGz5rsToncTo=}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# AWS Configuration
aws.access-key=${AWS_ACCESS_KEY}
aws.secret-key=${AWS_SECRET_KEY}
aws.region=${AWS_REGION}
aws.s3.bucket=${AWS_S3_BUCKET}

# Logging (configured via logback-spring.xml for structured JSON in production)
logging.level.root=INFO
logging.level.com.ridelist=DEBUG


# Actuator endpoints for Kubernetes probes and metrics
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.info.env.enabled=true
management.health.mail.enabled=false

# Application info for /actuator/info
info.app.name=${spring.application.name:ride-list}
info.app.description=Marketplace for motorcycles, tricycles, bicycles, spare parts and accessories
info.app.version=1.0.0

# Application Settings
ridelist.image.min-count=${IMAGE_MIN_COUNT:1}
ridelist.image.max-count=${IMAGE_MAX_COUNT:10}
ridelist.image.allowed-types=image/jpeg,image/png,image/webp
ridelist.image.max-size-mb=${IMAGE_MAX_SIZE_MB:5}

# OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.display-request-duration=true

# Email Configuration
app.email.sender=${EMAIL_SENDER}
app.email.from-address=${EMAIL_FROM}
app.email.from-name=${EMAIL_FROM_NAME:RideList}

# Frontend URL (for email links)
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost}

# SMTP Configuration
spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
